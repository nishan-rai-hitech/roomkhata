name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull, build and restart on server
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -s' <<'EOF'
          set -euo pipefail
          # Non-interactive shells skip .bashrc, so load nvm if node was installed with it.
          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; fi

          cd ~/roomkhata
          git pull --ff-only
          npm ci
          npx prisma generate

          # Snapshot the database before touching its schema.
          node scripts/backup-db.mjs

          # A database created before migrations existed already has the 0_init
          # tables, so the first deploy records that migration as applied.
          npx prisma migrate deploy || {
            npx prisma migrate resolve --applied 0_init
            npx prisma migrate deploy
          }

          npm run build
          pm2 restart roomkhata --update-env
          # Remember the process list so `pm2 resurrect` / the startup service can restore it.
          pm2 save

          # Nightly backup at 20:15 UTC (02:00 in Nepal). Re-written on each deploy.
          NODE_BIN="$(command -v node)"
          CRON_LINE="15 20 * * * cd $HOME/roomkhata && $NODE_BIN scripts/backup-db.mjs >> $HOME/roomkhata-backups/backup.log 2>&1"
          { crontab -l 2>/dev/null | grep -v 'scripts/backup-db.mjs' || true; echo "$CRON_LINE"; } | crontab -
          EOF
